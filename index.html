<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>My amazing test page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <p>Welcome to the amazing web page!</p>
    <p>Den här a form:</p>
    <form action="/handling-page" method="post">
      <p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="user_name" value="Default Name" />
      </p>
      <p>
        <label for="mail">Email:</label>
        <input type="email" id="mail" name="user_email" value="Default Email" />
      </p>
      <p>
        <label for="msg">Message:</label>
        <textarea id="msg" name="user_message">I am a default message.</textarea>
      </p>
      <p class="button">
        <button type="submit">Send message</button>
      </p>
    </form>
  </body>
</html>
